syntax = "proto3";

option csharp_namespace = "GrpcSensorServer";

package GrpcSensor;

service SensorService {
  // Scanning
  rpc BLEScan(BLEScanRequest) returns (BLEScanResponse);
  rpc USBScan(USBScanRequest) returns (USBScanResponse);
  
  // Connection
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc DeviceExit(DeviceExitRequest) returns (DeviceExitResponse);
  
  // Data operations
  rpc GetSensorRange(GetSensorRangeRequest) returns (GetSensorRangeResponse);
  rpc StartSendData(StartSendDataRequest) returns (StartSendDataResponse);
  rpc StopSendData(StopSendDataRequest) returns (StopSendDataResponse);
  rpc ClearZero(ClearZeroRequest) returns (ClearZeroResponse);
  
  // Configuration
  rpc SetSensorLang(SetSensorLangRequest) returns (SetSensorLangResponse);
  rpc GetSwitchRange(GetSwitchRangeRequest) returns (GetSwitchRangeResponse);
  rpc SetRange(SetRangeRequest) returns (SetRangeResponse);
  rpc GetCurrentFrequency(GetCurrentFrequencyRequest) returns (GetCurrentFrequencyResponse);
  rpc GetSupportFrequency(GetSupportFrequencyRequest) returns (GetSupportFrequencyResponse);
  rpc SetFrequency(SetFrequencyRequest) returns (SetFrequencyResponse);
  
  // Events
  rpc SubscribeToSensorData(SubscribeRequest) returns (stream SensorDataMessage);
  rpc SubscribeToSensorEvents(SubscribeRequest) returns (stream SensorEventMessage);
}

// Common messages
message DeviceModel {
  string device_id = 1;
  string device_name = 2;
  string device_mac = 3;
  DeviceType device_type = 4;
}

enum DeviceType {
  BLE = 0;
  USB = 1;
}

enum ConnectEnum {
  SUCCESSFUL = 0;
  EXCEPTION = 1;
  FAIL = 2;
  GET_SERVICE_FAIL = 3;
  GET_CHARACTERISTIC_FAIL = 4;
}

message DataTypeModel {
  int32 range_id = 1;
  string range_name = 2;
  string unit = 3;
  double lower_limit = 4;
  double upper_limit = 5;
  double decimal_count = 6;
}

message SensorDataModel {
  int32 range_id = 1;
  double data_value = 2;
}

message FrequencyModel {
  int32 frequency = 1;
}

message SwitchRangeModel {
  int32 range_id = 1;
  double lower_limit = 2;
  double upper_limit = 3;
}

// Request/Response messages
message BLEScanRequest {
  int32 timeout = 1;
}

message BLEScanResponse {
  repeated DeviceModel devices = 1;
  string error = 2;
}

message USBScanRequest {}

message USBScanResponse {
  repeated DeviceModel devices = 1;
  string error = 2;
}

message ConnectRequest {
  string mac = 1;
}

message ConnectResponse {
  ConnectEnum result = 1;
  string error = 2;
}

message DisconnectRequest {
  string device_mac = 1;
}

message DisconnectResponse {
  bool success = 1;
  string error = 2;
}

message GetSensorRangeRequest {
  string device_mac = 1;
}

message GetSensorRangeResponse {
  repeated DataTypeModel ranges = 1;
  string error = 2;
}

message StartSendDataRequest {
  string device_mac = 1;
  repeated int32 range_id_list = 2;
}

message StartSendDataResponse {
  bool success = 1;
  string error = 2;
}

message StopSendDataRequest {
  string device_mac = 1;
}

message StopSendDataResponse {
  bool success = 1;
  string error = 2;
}

message ClearZeroRequest {
  string device_mac = 1;
  repeated int32 range_id_list = 2;
}

message ClearZeroResponse {
  bool success = 1;
  string error = 2;
}

message SetSensorLangRequest {
  string device_mac = 1;
  int32 lang_type = 2;
}

message SetSensorLangResponse {
  bool success = 1;
  string error = 2;
}

message GetSwitchRangeRequest {
  string device_mac = 1;
}

message GetSwitchRangeResponse {
  repeated SwitchRangeModel ranges = 1;
  string error = 2;
}

message SetRangeRequest {
  string device_mac = 1;
  int32 range_id = 2;
}

message SetRangeResponse {
  bool success = 1;
  string error = 2;
}

message GetCurrentFrequencyRequest {
  string device_mac = 1;
}

message GetCurrentFrequencyResponse {
  int32 frequency = 1;
  string error = 2;
}

message GetSupportFrequencyRequest {
  string device_mac = 1;
}

message GetSupportFrequencyResponse {
  repeated FrequencyModel frequencies = 1;
  string error = 2;
}

message SetFrequencyRequest {
  string device_mac = 1;
  int32 frequency = 2;
}

message SetFrequencyResponse {
  bool success = 1;
  string error = 2;
}

message DeviceExitRequest {
  string device_mac = 1;
}

message DeviceExitResponse {
  bool success = 1;
  string error = 2;
}

message SubscribeRequest {
  string device_mac = 1;
}

message SensorDataMessage {
  repeated SensorDataModel sensor_data = 1;
}

message SensorEventMessage {
  string device_mac = 1;
  string event_type = 2;
  string message = 3;
}
