syntax = "proto3";

option csharp_namespace = "GrpcServer";

package greet;

// Сервис приветствия
service Greeter {
  rpc SayHello (HelloRequest) returns (HelloReply);
  rpc SayHelloStream (HelloRequest) returns (stream HelloReply);
}

// Запрос
message HelloRequest {
  string name = 1;
}

// Ответ
message HelloReply {
  string message = 1;
}